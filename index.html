<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MM Tours Chalo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

#loading {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  background: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

#viewer {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
  background: #fff;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 5px solid #ddd;
  border-top: 5px solid #1e88e5;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-text {
  font-size: 18px;
  color: #333;
  letter-spacing: 1px;
  text-align: center;
  padding: 0 20px;
}
</style>
</head>
<body>

<div id="loading" role="status" aria-live="polite">
  <div class="spinner"></div>
  <div class="loading-text">Loading content...</div>
</div>

<!--
  IMPORTANT: web-share permission is delegated to the embedded app here.
  Keep this allow attribute even though src is assigned dynamically.
-->
<iframe
  id="viewer"
  title="MM Tours Chalo"
  allow="web-share; clipboard-write"
  referrerpolicy="strict-origin-when-cross-origin">
</iframe>

<script>
'use strict';

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxMHMZZFTFXBux3CE1t567yvOnub1u4HKdwcrofGE7wDH0SxxHKcGufYS4umSaYCIn/exec';

const iframe = document.getElementById('viewer');
const loading = document.getElementById('loading');
const loadingText = document.querySelector('.loading-text');

function showLoadError(message) {
  loadingText.textContent = message;
  const spinner = document.querySelector('.spinner');
  if (spinner) spinner.style.display = 'none';
}

async function loadIframe() {
  try {
    const response = await fetch(SCRIPT_URL, { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Could not retrieve the app URL (HTTP ' + response.status + ').');
    }

    const data = await response.json();
    if (!data || typeof data.iframeUrl !== 'string' || !data.iframeUrl.trim()) {
      throw new Error('The response does not contain a valid iframeUrl.');
    }

    // Forward shared-link parameters (especially packageId) into the Apps Script
    // URL fetched from the Google Sheet. The embedded app reads packageId from
    // its own URL and opens the matching package popup automatically.
    const targetUrl = new URL(data.iframeUrl);
    const incomingParams = new URLSearchParams(window.location.search);

    // Forward all shared-link parameters to the actual MM Tours Chalo web app URL
    // fetched from Sheet1!A2. In particular, ?packageId=WB1989 must reach doGet(e).
    for (const [key, value] of incomingParams.entries()) {
      if (key && value !== "") targetUrl.searchParams.set(key, value);
    }

    // Keep the hash too if a future shared link uses one (packageId normally uses query string).
    if (window.location.hash) targetUrl.hash = window.location.hash;

    // Explicitly retain the Permissions Policy delegation before setting src.
    iframe.setAttribute('allow', 'web-share; clipboard-write');
    iframe.onload = function () {
      loading.style.display = 'none';
    };
    iframe.onerror = function () {
      showLoadError('Unable to load content. Please refresh and try again.');
    };
    iframe.src = targetUrl.toString();
  } catch (error) {
    console.error('MM Tours Chalo iframe loading error:', error);
    showLoadError('Failed to load content. Please refresh and try again.');
  }
}

loadIframe();
</script>
</body>
</html>
