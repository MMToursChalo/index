<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fa">
<title>MM Tours Chalo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;min-height:100%;overflow:hidden;scrollbar-width:none;-ms-overflow-style:none;font-family:Arial,sans-serif;background:#f7f8fa}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{width:0!important;height:0!important;display:none!important}
/* Logo loader with rotating multicolour border */
#appLoader{
  position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:14px;padding:24px;background:#f7f8fa;overflow:hidden;
  opacity:1;visibility:visible;transition:opacity .28s ease,visibility .28s ease;
}
#appLoader.hidden{opacity:0;visibility:hidden;pointer-events:none}
.loader-logo-wrap{
  position:relative;width:116px;height:116px;display:grid;place-items:center;
  isolation:isolate;border-radius:26px;animation:logoHeartbeat 1.25s ease-in-out infinite;will-change:transform;
}
.loader-logo-wrap::before{
  content:"";position:absolute;inset:0;border-radius:26px;
  background:conic-gradient(from 0deg,#3b82f6,#8b5cf6,#ec4899,#f59e0b,#22c55e,#06b6d4,#3b82f6);
  animation:loaderBorderSpin 1.6s linear infinite;z-index:-2;
}
.loader-logo-wrap::after{
  content:"";position:absolute;inset:4px;border-radius:22px;background:#fff;z-index:-1;
}
.loader-logo-wrap img{
  width:100px;height:100px;display:block;object-fit:contain;background:#fff;border-radius:20px;
  box-shadow:0 0 0 5px rgba(59,130,246,.15),0 0 20px rgba(59,130,246,.35),
    0 0 35px rgba(236,72,153,.24),0 0 50px rgba(245,158,11,.18),
    0 15px 30px rgba(0,0,0,.22);
}
.loader-brand{margin-top:2px;color:#c15023;font-size:23px;line-height:1.2;font-weight:800;letter-spacing:.2px;text-align:center;text-shadow:0 2px 12px rgba(193,80,35,.14)}
.loader-caption{color:#5f6368;font-size:14px;font-weight:600;letter-spacing:.25px;text-align:center}
@keyframes logoHeartbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.07)}28%{transform:scale(1)}42%{transform:scale(1.045)}58%{transform:scale(1)} }
.loader-dots::after{content:"";display:inline-block;width:20px;text-align:left;animation:loaderDots 1.2s steps(4,end) infinite}
@keyframes loaderBorderSpin{to{transform:rotate(360deg)}}
@keyframes loaderDots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
@media(prefers-reduced-motion:reduce){.loader-logo-wrap::before,.loader-dots::after,.loader-logo-wrap{animation:none}}
/* Main app iframe */
#viewer{position:fixed;inset:0;display:block;width:100%;height:100%;height:100dvh;border:0;background:#fff}
/* Error message */
#loadError{display:none;position:fixed;inset:0;z-index:10001;align-items:center;justify-content:center;padding:24px;background:#f7f8fa}
#loadError.show{display:flex}
.error-box{width:100%;max-width:380px;padding:28px 22px;text-align:center;background:#fff;border-radius:18px;box-shadow:0 10px 35px rgba(0,0,0,.09)}
.error-icon{font-size:42px;margin-bottom:14px}
.error-box h2{margin-bottom:10px;color:#252525;font-size:21px}
.error-box p{color:#6b7280;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.retry-button{margin-top:20px;padding:12px 25px;border:none;border-radius:9px;background:#c15023;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
/* Exit fallback */
#parentExitFallback{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:24px;background:#fff8f3;text-align:center;color:#35251e}
#parentExitFallback.show{display:flex}
#parentExitFallback section{width:100%;max-width:360px;padding:28px;background:#fff;border-radius:20px;box-shadow:0 12px 45px rgba(0,0,0,.12)}
#parentExitFallback h2{margin-bottom:10px;font-size:22px}
#parentExitFallback p{color:#75675f;font-size:14px;line-height:1.6}
.exit-actions{display:flex;gap:10px;margin-top:22px}
.exit-actions button{flex:1;padding:12px 10px;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer}
#stayButton{background:#f1f2f4;color:#333}
#exitButton{background:#c15023;color:#fff}
</style>
</head>
<body>
<!-- Logo loader -->
<div id="appLoader" role="status" aria-live="polite">
  <div class="loader-logo-wrap">
    <img src="https://lh3.googleusercontent.com/d/1AupEVepjEwOxyMX8tr4NuWtAKC1w9OLa=w1000" alt="MM Tours Chalo Logo">
  </div>
  <div class="loader-brand">MM Tours Chalo</div>
  <div class="loader-caption">Preparing your travel experience<span class="loader-dots"></span></div>
</div>

<!-- Main app iframe -->
<iframe id="viewer" title="MM Tours Chalo" allow="web-share; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>

<!-- Load error -->
<div id="loadError" role="alert">
  <div class="error-box">
    <div class="error-icon">⚠️</div>
    <h2>Unable to Load</h2>
    <p id="errorMessage">Unable to load MM Tours Chalo. Please try again.</p>
    <button class="retry-button" id="retryButton" type="button">Try Again</button>
  </div>
</div>

<!-- Exit fallback -->
<div id="parentExitFallback">
  <section>
    <div style="font-size:38px;margin-bottom:12px">👋</div>
    <h2>MM Tours Chalo</h2>
    <p>Do you want to exit MM Tours Chalo?</p>
    <div class="exit-actions">
      <button id="stayButton" type="button">No, Stay</button>
      <button id="exitButton" type="button">Yes, Exit</button>
    </div>
  </section>
</div>

<script>
'use strict';

/* Configuration */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxMHMZZFTFXBux3CE1t567yvOnub1u4HKdwcrofGE7wDH0SxxHKcGufYS4umSaYCIn/exec';
const iframe = document.getElementById('viewer');
const appLoader = document.getElementById('appLoader');
const loadError = document.getElementById('loadError');
const errorMessage = document.getElementById('errorMessage');
const parentExitFallback = document.getElementById('parentExitFallback');
const initialHistoryLength = window.history.length;
const appUrl = window.location.href;
let appLoaded = false;
let allowExitNavigation = false;
let exitFallbackTimer = null;
let loadRequestNumber = 0;

function showLoader() {
  appLoader.classList.remove('hidden');
}

function hideLoader() {
  appLoader.classList.add('hidden');
}

function showLoadError(message) {
  hideLoader();
  errorMessage.textContent = message;
  loadError.classList.add('show');
}

/* Browser back handling */
function installBackTrap() {
  try {
    history.pushState({ mmToursParentBackTrap: true }, '', appUrl);
  } catch (error) {
    console.warn('Could not initialize back trap:', error);
  }
}

function handleBrowserBack() {
  if (allowExitNavigation) return;
  installBackTrap();
  if (appLoaded && iframe.contentWindow) {
    iframe.contentWindow.postMessage({ type: 'MM_TOURS_BACK_REQUEST' }, '*');
  } else {
    parentExitFallback.classList.add('show');
  }
}

function leavePage() {
  if (allowExitNavigation) return;
  allowExitNavigation = true;
  parentExitFallback.classList.remove('show');
  if (initialHistoryLength > 1) {
    history.go(-2);
    exitFallbackTimer = setTimeout(() => {
      parentExitFallback.classList.add('show');
    }, 700);
  } else {
    try {
      window.close();
    } catch (error) {
      console.warn('Browser prevented closing the tab.');
    }
    exitFallbackTimer = setTimeout(() => {
      parentExitFallback.classList.add('show');
    }, 300);
  }
}

window.addEventListener('popstate', handleBrowserBack);
window.addEventListener('message', event => {
  if (event.source !== iframe.contentWindow) return;
  const msg = event.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'MM_TOURS_EXIT_CONFIRMED') leavePage();
  if (msg.type === 'MM_TOURS_APP_READY') { appLoaded = true; hideLoader(); }
});

document.getElementById('stayButton').addEventListener('click', () => {
  parentExitFallback.classList.remove('show');
  installBackTrap();
});
document.getElementById('exitButton').addEventListener('click', leavePage);
installBackTrap();

/* Load the app iframe URL directly without a skeleton/loading overlay */
async function loadIframe() {
  const thisRequest = ++loadRequestNumber;
  appLoaded = false;
  showLoader();
  parentExitFallback.classList.remove('show');
  loadError.classList.remove('show');

  try {
    const response = await fetch(SCRIPT_URL, { cache: 'no-store' });
    if (!response.ok) {
      throw new Error('Could not retrieve the app URL (HTTP ' + response.status + ').');
    }

    const data = await response.json();
    if (!data || typeof data.iframeUrl !== 'string' || !data.iframeUrl.trim()) {
      throw new Error('The response does not contain a valid iframeUrl.');
    }

    const targetUrl = new URL(data.iframeUrl);
    const incomingParams = new URLSearchParams(window.location.search);
    incomingParams.forEach((value, key) => targetUrl.searchParams.set(key, value));
    targetUrl.searchParams.set('mmWrapper', '1');

    iframe.setAttribute('allow', 'web-share; clipboard-write');
    iframe.onload = () => {
      if (thisRequest !== loadRequestNumber) return;
      appLoaded = true;
      hideLoader();
    };
    iframe.onerror = () => {
      if (thisRequest !== loadRequestNumber) return;
      showLoadError('Unable to load content. Please refresh and try again.');
    };
    iframe.src = targetUrl.toString();
  } catch (error) {
    if (thisRequest !== loadRequestNumber) return;
    console.error('MM Tours Chalo iframe loading error:', error);
    showLoadError('Failed to load content. ' + (error.message || 'Please try again.'));
  }
}

document.getElementById('retryButton').addEventListener('click', loadIframe);
loadIframe();
</script>
</body>
</html>
